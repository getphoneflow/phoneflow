services:
  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    network_mode: "host"
    cap_add:
      - SYS_ADMIN
    shm_size: "1gb"
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: '${LIVEKIT_API_KEY}'
        api_secret: '${LIVEKIT_API_SECRET}'
        ws_url: '${LIVEKIT_URL}'
        redis:
          address: '${REDIS_ADDRESS}'
        enable_room_composite_sdk_source: true
        log_level: info
